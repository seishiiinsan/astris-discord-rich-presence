name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.0.0) — crée le tag vX.Y.Z"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then V="${{ inputs.version }}"
          else V="$(tr -d '[:space:]' < VERSION)"; fi
          echo "version=${V#v}" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          VERSION="${{ steps.v.outputs.version }}" ./build.sh
          ditto -c -k --keepParent build/AstrisRPC.app build/AstrisRPC.zip
          ./dmg.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            build/AstrisRPC.dmg
            build/AstrisRPC.zip
          generate_release_notes: true
