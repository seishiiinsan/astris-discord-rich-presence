name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VERSION=0.0.0-dev
          VERSION="$VERSION" ./build.sh
          ditto -c -k --keepParent build/AstrisRPC.app build/AstrisRPC.zip

      - uses: actions/upload-artifact@v4
        with:
          name: AstrisRPC
          path: build/AstrisRPC.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/AstrisRPC.zip
          generate_release_notes: true
